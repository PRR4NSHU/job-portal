<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <h2>Reset Password</h2>
        <p>Enter your email and new password</p>

        <form id="resetForm">
            <input type="email" id="email" placeholder="Registered Email" required>
            <input type="password" id="newPassword" placeholder="New Password" required minlength="6">
            
            <button type="submit">Update Password</button>
        </form>

        <p class="switch-text"><a href="login.html">Back to Login</a></p>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const newPassword = document.getElementById('newPassword').value;

            const response = await fetch('/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, newPassword })
            });

            const data = await response.json();

            if (response.ok) {
                alert(data.message);
                window.location.href = "login.html"; // Update ke baad login page par bhejo
            } else {
                alert(data.message);
            }
        });
    </script>
</body>
</html>
