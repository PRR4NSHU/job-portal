<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | JobConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- GLOBAL STYLES --- */
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #e0e5ec;
            background-image:
                radial-gradient(at 0% 0%, rgba(108, 92, 231, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(116, 185, 255, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(162, 155, 254, 0.3) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(223, 228, 234, 0.8) 0px, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
            min-height: 100vh;
            color: #2d3436;
        }

        .main-layout {
            background: transparent !important;
        }

        /* --- NAVBAR (Desktop) --- */
        .navbar {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #6c5ce7;
            letter-spacing: 0.5px;
        }

        .menu-toggle {
            display: none;
            font-size: 24px;
            color: #2d3436;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .nav-icons a {
            text-decoration: none;
            color: #b2bec3;
            font-size: 22px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            position: relative;
        }

        .nav-icons a:hover,
        .nav-icons a.active {
            color: #6c5ce7;
            background: rgba(108, 92, 231, 0.1);
            transform: translateY(-2px);
        }

        .logout-btn {
            cursor: pointer;
            color: #ff7675;
            font-size: 22px;
            transition: 0.3s;
        }

        .logout-btn:hover {
            transform: scale(1.1);
        }

        .nav-profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(108, 92, 231, 0.2);
            transition: 0.3s;
        }

        .nav-profile-img:hover {
            transform: scale(1.1);
            border-color: #6c5ce7;
        }

        /* --- UPDATED MOBILE NAVBAR --- */
        @media (max-width: 900px) {
            .navbar {
                padding: 0 20px;
                height: 65px;
            }

            .menu-toggle {
                display: block;
            }

            .nav-icons {
                position: absolute;
                top: 65px;
                left: 0;
                width: 100%;
                background: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(25px);

                /* CHANGED: Horizontal Layout for Icons */
                flex-direction: row;
                justify-content: center;
                /* Center Icons */
                gap: 25px;
                /* Spacing between icons */

                padding: 15px 0;
                border-bottom: 1px solid rgba(0, 0, 0, 0.05);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);

                transform: translateY(-150%);
                opacity: 0;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 998;
            }

            .nav-icons.active {
                transform: translateY(0);
                opacity: 1;
            }

            /* Mobile Icons Styling (No Text) */
            .nav-icons a {
                width: 50px;
                /* Square Buttons */
                height: 50px;
                background: #f8f9fa;
                border-radius: 50%;
                /* Circular */
                font-size: 20px;
                color: #555;
                justify-content: center;
                padding-left: 0;
                /* Reset Padding */
                border: 1px solid transparent;
            }

            .nav-icons a:hover,
            .nav-icons a.active {
                background: #fff;
                border-color: #6c5ce7;
                color: #6c5ce7;
                box-shadow: 0 5px 15px rgba(108, 92, 231, 0.15);
                transform: translateY(-3px);
            }

            /* Logout Button Mobile */
            .logout-btn {
                width: 50px;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #ffecec;
                border-radius: 50%;
                color: #d63031;
            }

            /* Profile Pic Size */
            .nav-profile-img {
                width: 50px;
                height: 50px;
                margin: 0;
                border: 2px solid #6c5ce7;
            }
        }

        /* --- REST OF CSS --- */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .profile-widget-btn {
            display: none;
            position: fixed;
            top: 85px;
            left: 15px;
            background: #6c5ce7;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            cursor: pointer;
            z-index: 999;
            font-size: 20px;
            transition: 0.3s;
        }

        @media (max-width: 900px) {
            .main-layout {
                display: block;
                padding: 10px;
                margin-top: 10px;
            }

            .sidebar-right,
            .sidebar-left {
                display: none;
            }

            .profile-widget-btn {
                display: flex;
            }

            .sidebar-left.active {
                display: flex !important;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.6);
                z-index: 2000;
                justify-content: center;
                align-items: center;
                backdrop-filter: blur(5px);
            }

            .sidebar-left.active .profile-card {
                width: 90%;
                max-width: 350px;
                background: #fff;
            }
        }

        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            border-radius: 20px;
        }

        .profile-card {
            text-align: center;
            overflow: hidden;
            padding-bottom: 20px;
        }

        .cover-photo {
            height: 80px;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            width: 100%;
        }

        .profile-card .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid white;
            margin-top: -40px;
            background: white;
            object-fit: cover;
        }

        .sidebar-edit-btn {
            background: transparent;
            border: 1px solid #6c5ce7;
            color: #6c5ce7;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 13px;
            cursor: pointer;
            width: 80%;
            margin-top: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .sidebar-edit-btn:hover {
            background: #6c5ce7;
            color: white;
        }

        .sidebar-stats {
            text-align: left;
            padding: 15px 25px;
            font-size: 13px;
            color: #555;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            margin-top: 15px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .create-post-box {
            padding: 20px;
            margin-bottom: 20px;
            background: #fff !important;
        }

        .input-row {
            display: flex;
            align-items: center;
            background: #f1f2f6;
            border-radius: 30px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }

        .user-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }

        .create-post-box input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .media-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 20px;
            background: #f8f9fa;
            transition: 0.2s;
        }

        .media-btn:hover {
            background: #e2e6ea;
        }

        .post-btn {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
            transition: 0.2s;
        }

        .post-btn:hover {
            transform: translateY(-2px);
        }

        .post-card {
            padding: 20px;
            margin-bottom: 20px;
            background: #fff !important;
        }

        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .post-text {
            font-size: 14px;
            color: #333;
            line-height: 1.6;
        }

        .post-media {
            width: 100%;
            border-radius: 12px;
            margin-top: 10px;
            max-height: 400px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid #eee;
        }

        .active-like {
            color: #6c5ce7 !important;
            font-weight: bold;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            50% {
                transform: scale(1.2);
            }
        }

        .post-actions {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            border-top: 1px solid #f5f5f5;
            padding-top: 15px;
        }

        .post-actions span {
            cursor: pointer;
            font-size: 14px;
            color: #636e72;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .post-actions span:hover {
            color: #6c5ce7;
        }

        .comment-section {
            background: #f9f9f9;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            padding: 15px;
        }

        .single-comment {
            font-size: 13px;
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .comment-input-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .comment-input-box input {
            width: 100%;
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }

        .comment-btn-small {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        #top-loader {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: #6c5ce7;
            width: 0%;
            z-index: 9999;
            transition: width 0.4s ease;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border-left: 5px solid #6c5ce7;
            display: flex;
            align-items: center;
            gap: 15px;
            transform: translateX(120%);
            transition: 0.3s;
            z-index: 3000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .post-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2500;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .post-modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        .post-modal-container {
            background: white;
            width: 90%;
            max-width: 950px;
            height: 85vh;
            border-radius: 15px;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .modal-media-section {
            flex: 1.5;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-media-section img,
        .modal-media-section video {
            max-width: 100%;
            max-height: 100%;
        }

        .modal-info-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #eee;
        }

        .modal-header {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 15px;
            border-top: 1px solid #eee;
            background: #f8f9fa;
        }

        .close-modal-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            color: white;
            font-size: 35px;
            cursor: pointer;
            z-index: 2600;
        }

        .mobile-close-btn {
            display: none;
            font-size: 24px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .post-modal-container {
                flex-direction: column;
                height: 100vh;
                width: 100%;
                border-radius: 0;
            }

            .modal-media-section {
                flex: none;
                height: 40%;
            }

            .modal-info-section {
                height: 60%;
            }

            .close-modal-btn {
                display: none;
            }

            .mobile-close-btn {
                display: block;
            }
        }

        /* Chat Widget */
        .chat-widget-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #6c5ce7;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 5px 20px rgba(108, 92, 231, 0.4);
            cursor: pointer;
            z-index: 2000;
            transition: 0.3s;
        }

        .chat-widget-btn:hover {
            transform: scale(1.1);
        }

        .chat-box-container {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 350px;
            height: 500px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #eee;
        }

        .chat-widget-header {
            padding: 15px;
            background: #6c5ce7;
            color: white;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-content-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 1px solid #f5f5f5;
        }

        .chat-user-item:hover {
            background: #f8f9fa;
        }

        .msg-bubble {
            padding: 8px 12px;
            border-radius: 15px;
            margin-bottom: 8px;
            font-size: 13px;
            max-width: 80%;
            width: fit-content;
        }

        .msg-sent {
            background: #6c5ce7;
            color: white;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .msg-received {
            background: #f1f2f6;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        .chat-input-mini {
            padding: 10px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 5px;
        }

        .chat-input-mini input {
            flex: 1;
            border: 1px solid #ddd;
            padding: 8px;
            border-radius: 20px;
            outline: none;
        }

        .chat-input-mini button {
            background: #6c5ce7;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="top-loader"></div>
    <div id="toast-box" class="toast">
        <i class="fas fa-check-circle" style="color:#6c5ce7; font-size: 24px;"></i>
        <div>
            <h4 style="margin:0; font-size:14px;">Success</h4><small id="toast-msg">Action Completed</small>
        </div>
    </div>

    <nav class="navbar">
        <div class="logo">JobConnect</div>
        <div class="menu-toggle" onclick="toggleNavbar()"><i class="fas fa-bars" id="menu-icon"></i></div>
        <div class="nav-icons" id="nav-links">
            <img src="https://via.placeholder.com/30" class="nav-profile-img"
                onclick="window.location.href='profile.html'" title="Profile">
            <a href="dashboard.html" id="nav-home" title="Home"><i class="fas fa-home"></i></a>
            <a href="jobs.html" id="nav-jobs" title="Jobs"><i class="fas fa-briefcase"></i></a>
            <a href="network.html" id="nav-network" title="Network"><i class="fas fa-user-friends"></i></a>
            <div class="logout-btn" onclick="logoutUser()"> <i class="fas fa-sign-out-alt"></i> </div>
        </div>
    </nav>

    <div class="profile-widget-btn" onclick="toggleProfileModal()"><i class="fas fa-user"></i></div>

    <div class="main-layout">
        <div class="sidebar-left" id="profile-modal" onclick="closeProfileModal(event)">
            <div class="card profile-card">
                <div class="cover-photo"></div>
                <img src="https://via.placeholder.com/70" class="profile-pic">
                <h3 id="sidebar-name">Loading...</h3>
                <p id="sidebar-headline" style="color: gray; font-size: 12px; margin-bottom: 10px;">...</p>
                <div class="sidebar-stats">
                    <div class="stat-row"><span>Connections</span><span style="color:#6c5ce7; font-weight:bold;"
                            id="sidebar-conn-count">0</span></div>
                    <div class="stat-row"><span>Profile Views</span><span style="color:#6c5ce7; font-weight:bold;"
                            id="sidebar-view-count">0</span></div>
                </div>
                <button onclick="window.location.href='profile.html'" class="sidebar-edit-btn"><i
                        class="fas fa-pencil-alt"></i> Edit Profile</button>
            </div>
        </div>

        <div class="feed-section">
            <div class="card create-post-box">
                <h3 style="margin-bottom: 15px; color: #2d3436; font-size: 16px; font-weight: 700;">Create a Post</h3>
                <form id="postForm" enctype="multipart/form-data">
                    <div class="input-row">
                        <img src="https://via.placeholder.com/40" class="user-icon">
                        <input type="text" name="content" placeholder="What's on your mind today?" autocomplete="off"
                            required>
                    </div>
                    <input type="hidden" name="username" id="post-username">
                    <div class="action-row">
                        <label class="media-btn"><i class="fas fa-images" style="color: #00b894;"></i>
                            <span>Photo/Video</span><input type="file" name="media" hidden></label>
                        <button type="submit" class="post-btn" id="submit-post-btn"><span>Post</span> <i
                                class="fas fa-paper-plane"></i></button>
                    </div>
                </form>
            </div>
            <div id="feed"></div>
        </div>

        <div class="sidebar-right">
            <div class="card" style="border:none; box-shadow:none; background:transparent; padding:0;">
                <h3 style="margin-bottom:15px; font-size:16px; margin-left:5px;">Recommended Jobs</h3>
                <div id="side-job-feed">
                    <p style="font-size:12px; color:gray; text-align:center;">Loading jobs...</p>
                </div>
                <a href="jobs.html"
                    style="display:block; text-align:center; font-size:12px; margin-top:10px; color:#6c5ce7; font-weight:600;">View
                    all jobs</a>
            </div>
        </div>
    </div>

    <div class="post-modal-overlay" id="postModal" onclick="closePostModal(event)">
        <span class="close-modal-btn" onclick="closePostModalForce()">&times;</span>
        <div class="post-modal-container">
            <div class="modal-media-section" id="modal-media-content"></div>
            <div class="modal-info-section">
                <div class="modal-header">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="" id="modal-user-pic" style="width:35px; height:35px; border-radius:50%;">
                        <strong id="modal-user-name">User</strong>
                    </div>
                    <span class="mobile-close-btn" onclick="closePostModalForce()"><i class="fas fa-times"></i></span>
                </div>
                <div class="modal-body">
                    <p class="modal-caption" id="modal-caption" style="font-size:14px; margin-bottom:15px;"></p>
                    <div class="modal-comments-list" id="modal-comments-list"></div>
                </div>
                <div class="modal-footer">
                    <div class="comment-input-box">
                        <input type="text" id="modal-comment-input" placeholder="Add a comment...">
                        <button class="comment-btn-small" id="modal-post-btn">Post</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-widget-btn" onclick="toggleChat()"><i class="fas fa-comment-dots"></i></div>
    <div class="chat-box-container" id="chat-widget">
        <div class="chat-widget-header">
            <span id="chat-title">Messaging</span>
            <span style="cursor:pointer;" onclick="toggleChat()"><i class="fas fa-times"></i></span>
        </div>
        <div id="contact-list-view" class="chat-content-area">
            <div id="my-connections-list"></div>
        </div>
        <div id="conversation-view" class="chat-content-area" style="display:none; padding-bottom:0;">
            <div style="margin-bottom:10px; cursor:pointer; color:#6c5ce7; font-size:12px;" onclick="backToContacts()">
                <i class="fas fa-arrow-left"></i> Back
            </div>
            <div id="messages-area"></div>
        </div>
        <form id="mini-chat-form" class="chat-input-mini" style="display:none;">
            <input type="text" id="mini-msg-input" placeholder="Type..." autocomplete="off">
            <button type="submit"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>

    <div id="logout-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon">👋</div>
            <h3 class="modal-title">Signing Out?</h3>
            <div style="display: flex; gap: 10px; margin-top:20px;">
                <button class="modal-btn btn-danger" onclick="confirmLogout()">Yes</button>
                <button class="modal-btn btn-outline" onclick="closeLogoutModal()">No</button>
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) window.location.href = "login.html";
        let fetchedPosts = [];

        function toggleNavbar() {
            const navLinks = document.getElementById('nav-links');
            const icon = document.getElementById('menu-icon');
            navLinks.classList.toggle('active');
            if (navLinks.classList.contains('active')) {
                icon.classList.remove('fa-bars'); icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times'); icon.classList.add('fa-bars');
            }
        }

        function toggleProfileModal() { document.getElementById('profile-modal').classList.toggle('active'); }
        function closeProfileModal(event) { if (event.target.id === 'profile-modal') event.target.classList.remove('active'); }

        loadSidebarData();
        async function loadSidebarData() {
            try {
                const res = await fetch('/get-profile', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: currentUser.email }) });
                const user = await res.json();
                document.getElementById('sidebar-name').innerText = user.name;
                document.getElementById('sidebar-headline').innerText = user.headline || "JobConnect User";
                document.getElementById('post-username').value = user.name;
                document.getElementById('sidebar-conn-count').innerText = user.connections ? user.connections.length : 0;
                document.getElementById('sidebar-view-count').innerText = user.profileViews || 0;
                const picUrl = user.profilePic || "https://via.placeholder.com/150";
                document.querySelectorAll('.profile-pic, .nav-profile-img, .user-icon').forEach(img => img.src = picUrl);
            } catch (err) { console.log(err); }
        }

        loadPosts();
        async function loadPosts() {
            const res = await fetch('/posts');
            fetchedPosts = await res.json();
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            fetchedPosts.forEach(post => {
                let mediaHtml = ''; let downloadLink = '';
                if (post.fileUrl) {
                    if (post.fileType.includes('image')) mediaHtml = `<img src="${post.fileUrl}" class="post-media clickable-area" onclick="openPostModal('${post._id}')">`;
                    else mediaHtml = `<video src="${post.fileUrl}" controls class="post-media clickable-area"></video>`;
                    if (post.userEmail === currentUser.email) downloadLink = `<a href="${post.fileUrl}" download target="_blank" class="download-btn"><i class="fas fa-download"></i> Download</a>`;
                }
                const userPic = post.userProfilePic || "https://via.placeholder.com/40";
                let deleteBtn = post.userEmail === currentUser.email ? `<span style="color:#ff7675; cursor:pointer; margin-left:auto;" onclick="deletePost('${post._id}')"><i class="fas fa-trash"></i></span>` : '';
                const likes = post.likes || [];
                const isLiked = likes.includes(currentUser._id);
                const likeClass = isLiked ? 'active-like' : '';
                const comments = post.comments || [];
                let commentsListHtml = '';
                comments.slice(0, 2).forEach(c => { commentsListHtml += `<div class="single-comment"><strong>${c.username}</strong>: ${c.text}</div>`; });
                if (comments.length > 2) commentsListHtml += `<div style="font-size:11px; color:gray; cursor:pointer;" onclick="openPostModal('${post._id}')">View all ${comments.length} comments</div>`;

                feed.innerHTML += `
                <div class="card post-card">
                    <div class="post-header" style="display:flex; align-items:center;">
                        <img src="${userPic}" style="width:40px; height:40px; border-radius:50%; margin-right:10px;">
                        <div><h4>${post.username}</h4><small>Just now</small></div>${deleteBtn}
                    </div>
                    <p class="post-text clickable-area" onclick="openPostModal('${post._id}')" style="margin-top:10px;">${post.content}</p>
                    ${mediaHtml}
                    <div style="font-size:11px; color:gray; margin-top:5px;"><span>${likes.length} Likes</span> • <span>${comments.length} Comments</span>${downloadLink}</div>
                    <div class="post-actions" style="margin-top:10px; border-top:1px solid #eee; padding-top:10px;">
                        <span onclick="toggleLike('${post._id}')" class="${likeClass}"><i class="fas fa-thumbs-up"></i> Like</span>
                        <span onclick="openPostModal('${post._id}')"><i class="far fa-comment"></i> Comment</span>
                    </div>
                    <div id="comment-box-${post._id}" class="comment-section" style="display:block; padding:10px;">
                        ${commentsListHtml}
                        <div class="comment-input-box">
                            <input type="text" id="input-${post._id}" placeholder="Write a comment..." onkeypress="if(event.key === 'Enter') postComment('${post._id}')">
                            <button class="comment-btn-small" onclick="postComment('${post._id}')">Post</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        function openPostModal(postId) {
            const post = fetchedPosts.find(p => p._id === postId); if (!post) return;
            const mediaContainer = document.getElementById('modal-media-content');
            if (post.fileUrl) mediaContainer.innerHTML = post.fileType.includes('image') ? `<img src="${post.fileUrl}">` : `<video src="${post.fileUrl}" controls autoplay></video>`;
            else mediaContainer.innerHTML = `<div style="color:#555; padding:20px; text-align:center;">No Media</div>`;
            document.getElementById('modal-user-pic').src = post.userProfilePic || "https://via.placeholder.com/40";
            document.getElementById('modal-user-name').innerText = post.username;
            document.getElementById('modal-caption').innerText = post.content;
            const list = document.getElementById('modal-comments-list'); list.innerHTML = '';
            if (post.comments && post.comments.length > 0) post.comments.forEach(c => list.innerHTML += `<div style="margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;"><strong>${c.username}</strong> <span style="color:#555;">${c.text}</span></div>`);
            else list.innerHTML = '<p style="color:gray; text-align:center;">No comments.</p>';
            document.getElementById('modal-post-btn').onclick = () => { postCommentFromModal(postId); };
            document.getElementById('modal-comment-input').onkeypress = (e) => { if (e.key === 'Enter') postCommentFromModal(postId); };
            document.getElementById('postModal').classList.add('active');
        }
        function closePostModal(e) { if (e.target.id === 'postModal') document.getElementById('postModal').classList.remove('active'); }
        function closePostModalForce() { document.getElementById('postModal').classList.remove('active'); }
        async function postCommentFromModal(id) { const txt = document.getElementById('modal-comment-input').value; if (!txt) return; await fetch('/comment-post', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId: id, username: currentUser.name, text: txt }) }); document.getElementById('modal-comment-input').value = ''; await loadPosts(); openPostModal(id); }

        document.getElementById('postForm').addEventListener('submit', async (e) => { e.preventDefault(); const loader = document.getElementById('top-loader'); const btn = document.getElementById('submit-post-btn'); loader.style.width = '30%'; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Posting...'; const formData = new FormData(e.target); formData.append('userEmail', currentUser.email); try { setTimeout(() => { loader.style.width = '70%'; }, 200); const res = await fetch('/create-post', { method: 'POST', body: formData }); if (res.ok) { loader.style.width = '100%'; loadPosts(); e.target.reset(); showNotification("Posted!"); } } catch (e) { alert("Error"); } finally { setTimeout(() => { loader.style.width = '0%'; btn.disabled = false; btn.innerHTML = 'Post'; }, 500); } });
        async function toggleLike(id) { await fetch('/like-post', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId: id, userId: currentUser._id }) }); loadPosts(); }
        async function deletePost(id) { if (confirm("Delete?")) { await fetch(`/delete-post/${id}`, { method: 'DELETE' }); loadPosts(); } }
        async function postComment(id) { const txt = document.getElementById(`input-${id}`).value; if (!txt) return; await fetch('/comment-post', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId: id, username: currentUser.name, text: txt }) }); loadPosts(); }

        let activeFriendId = null; let chatInterval = null;
        function toggleChat() { const box = document.getElementById('chat-widget'); box.style.display = (box.style.display === 'flex') ? 'none' : 'flex'; if (box.style.display === 'flex') loadConnections(); }
        async function loadConnections() { try { const res = await fetch('/get-network', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: currentUser.email }) }); const data = await res.json(); const list = document.getElementById('my-connections-list'); list.innerHTML = ''; if (data.connections.length === 0) { list.innerHTML = '<p style="text-align:center; font-size:12px; color:gray; margin-top:20px;">No connections yet.</p>'; return; } data.connections.forEach(user => { const pic = user.profilePic || "https://via.placeholder.com/30"; let lastMsg = user.lastMessage || "Tap to chat"; const msgColor = lastMsg.includes("You:") ? "#888" : "#333"; const fontWeight = lastMsg.includes("You:") ? "normal" : "500"; if (lastMsg.length > 25) lastMsg = lastMsg.substring(0, 25) + "..."; list.innerHTML += `<div class="chat-user-item" onclick="openMiniChat('${user._id}', '${user.name}')"><img src="${pic}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;"><div><div class="chat-user-name">${user.name}</div><small class="chat-last-msg" style="color:${msgColor}; font-weight:${fontWeight}; display:block;">${lastMsg}</small></div></div>`; }); } catch (err) { console.log(err); } }
        async function openMiniChat(id, name) { activeFriendId = id; document.getElementById('chat-title').innerText = name; document.getElementById('contact-list-view').style.display = 'none'; document.getElementById('conversation-view').style.display = 'flex'; document.getElementById('conversation-view').style.flexDirection = 'column'; document.getElementById('mini-chat-form').style.display = 'flex'; await fetch('/mark-read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ myId: currentUser._id, friendId: id }) }); document.querySelector('.chat-widget-btn').style.border = "none"; loadMiniMessages(); chatInterval = setInterval(loadMiniMessages, 2000); }
        function backToContacts() { activeFriendId = null; document.getElementById('chat-title').innerText = "Messaging"; document.getElementById('contact-list-view').style.display = 'block'; document.getElementById('conversation-view').style.display = 'none'; document.getElementById('mini-chat-form').style.display = 'none'; clearInterval(chatInterval); loadConnections(); }
        let lastMsgCount = 0;
        async function loadMiniMessages() { if (!activeFriendId) return; const res = await fetch('/get-messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ myEmail: currentUser.email, friendId: activeFriendId }) }); const data = await res.json(); const area = document.getElementById('messages-area'); if (data.messages.length > lastMsgCount) { lastMsgCount = data.messages.length; area.innerHTML = ''; data.messages.forEach(msg => { const type = (msg.sender === data.myId) ? 'msg-sent' : 'msg-received'; area.innerHTML += `<div class="msg-bubble ${type}">${msg.content}</div>`; }); area.scrollTop = area.scrollHeight; } }
        document.getElementById('mini-chat-form').addEventListener('submit', async (e) => { e.preventDefault(); const input = document.getElementById('mini-msg-input'); const content = input.value; if (!content) return; await fetch('/send-message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senderEmail: currentUser.email, receiverId: activeFriendId, content }) }); input.value = ''; loadMiniMessages(); });

        const path = window.location.pathname; if (path.includes('dashboard')) document.getElementById('nav-home').classList.add('active');
        checkUnreadMessages(); async function checkUnreadMessages() { const res = await fetch('/check-unread', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ myId: currentUser._id }) }); const data = await res.json(); if (data.unreadCount > 0) document.querySelector('.chat-widget-btn').style.border = "3px solid #ff7675"; }
        loadSideJobs(); async function loadSideJobs() { const res = await fetch('/all-jobs'); const jobs = await res.json(); const container = document.getElementById('side-job-feed'); container.innerHTML = ''; jobs.slice(0, 3).forEach(j => container.innerHTML += `<div style="padding:10px; border-bottom:1px solid #f0f0f0;"><strong>${j.title}</strong><br><small>${j.company}</small></div>`); }
        function logoutUser() { document.getElementById('logout-modal').style.display = 'flex'; }
        function closeLogoutModal() { document.getElementById('logout-modal').style.display = 'none'; }
        function confirmLogout() { localStorage.removeItem('currentUser'); window.location.href = "login.html"; }
        function showNotification(text) { const toast = document.getElementById('toast-box'); document.getElementById('toast-msg').innerText = text; toast.classList.add('show'); setTimeout(() => { toast.classList.remove('show'); }, 3000); }
    </script>
</body>

</html>
