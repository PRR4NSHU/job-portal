<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- Styles for Account Selection Modal --- */
        .role-modal-overlay {
            display: none; /* Hidden by default */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .role-modal {
            background: white; padding: 30px; border-radius: 15px;
            text-align: center; width: 90%; max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-family: 'Poppins', sans-serif;
        }
        .role-btn {
            display: block; width: 100%; padding: 12px; margin: 10px 0;
            border: none; border-radius: 8px; font-size: 16px; cursor: pointer;
            transition: 0.3s; color: white; font-weight: 500;
        }
        .btn-student { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
        .btn-hr { background: linear-gradient(135deg, #0984e3, #74b9ff); }
        .role-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        h3 { color: #333; margin-bottom: 20px; }
    </style>
</head>
<body class="login-body">

    <div class="login-container">
        <h2>Sign in</h2>
        <p>Stay updated on your professional world</p>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            
            <button type="submit">Sign in</button>
        </form>

        <p class="switch-text">New to JobConnect? <a href="register.html">Join now</a></p>
    </div>

    <div id="roleModal" class="role-modal-overlay">
        <div class="role-modal">
            <h3>Choose Account</h3>
            <p style="color:gray; font-size:13px; margin-bottom:20px;">You have multiple profiles with this email.</p>
            
            <button class="role-btn btn-student" onclick="selectRole('Student')">
                <i class="fas fa-user-graduate"></i> Continue as Student
            </button>
            <button class="role-btn btn-hr" onclick="selectRole('Recruiter')">
                <i class="fas fa-building"></i> Continue as HR
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script>
        if (localStorage.getItem('currentUser')) {
            window.location.href = "dashboard.html";
        }

        // Global variables to store email/pass temporarily
        let tempEmail = '';
        let tempPassword = '';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            tempEmail = document.getElementById('email').value;
            tempPassword = document.getElementById('password').value;

            performLogin(); // Call without role first
        });

        async function performLogin(selectedRole = null) {
            const payload = { email: tempEmail, password: tempPassword };
            if (selectedRole) payload.role = selectedRole; // Add role if selected

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                // 1. SUCCESS (Single Account or Role Selected)
                if (response.ok) {
                    localStorage.setItem('currentUser', JSON.stringify(data));
                    window.location.href = "dashboard.html";
                } 
                // 2. MULTIPLE ACCOUNTS FOUND (Status 300)
                else if (response.status === 300) {
                    // Show the Modal
                    document.getElementById('roleModal').style.display = 'flex';
                } 
                // 3. ERROR
                else {
                    alert(data.message);
                }
            } catch (err) {
                console.error(err);
                alert("Login Error");
            }
        }

        // Called when user clicks a button in the modal
        function selectRole(role) {
            performLogin(role); // Call login again WITH role
        }
    </script>

</body>
</html>
